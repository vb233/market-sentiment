name: Daily market snapshot

on:
  schedule:
    # Run twice in case GitHub's cron skips one — the script is idempotent
    # on date so a second run within the same day just overwrites the row.
    - cron: "0 22 * * 1-5"   # 22:00 UTC (≈5–6pm ET) — primary attempt
    - cron: "0 23 * * 1-5"   # 23:00 UTC (≈6–7pm ET) — backup attempt
  workflow_dispatch:         # manual trigger from the Actions tab

permissions:
  contents: write

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Fetch today's snapshot (and backfill gaps)
        run: python fetch_snapshot.py

      - name: Commit updated CSV
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/snapshots.csv
          if git diff --staged --quiet; then
            echo "No changes — nothing to commit."
          else
            git commit -m "Snapshot $(date -u +%Y-%m-%d)"
            git push
          fi
