<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Market Pulse · Daily breadth & sentiment</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E📊%3C/text%3E%3C/svg%3E" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=DM+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500;600&display=swap"
    rel="stylesheet"
  />

  <script src="https://cdn.tailwindcss.com"></script>
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/prop-types@15.8.1/prop-types.min.js"></script>
  <script crossorigin src="https://unpkg.com/recharts@2.12.7/umd/Recharts.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <style>
    body {
      background: #0c0c0e;
      font-family: "DM Sans", sans-serif;
      color: #e8e4dc;
      margin: 0;
    }
    .recharts-text { font-family: "JetBrains Mono", monospace; }
    input::placeholder { color: #4a4742; }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel" data-presets="react">
    // ────────────────────────────────────────────────────────────────────────
    // CONFIG
    // ────────────────────────────────────────────────────────────────────────
    const GH_USER   = "vb233";
    const GH_REPO   = "market-sentiment";
    const GH_BRANCH = "main";
    const GH_PATH   = "data/snapshots.csv";

    const RAW_URL = `https://raw.githubusercontent.com/${GH_USER}/${GH_REPO}/refs/heads/${GH_BRANCH}/${GH_PATH}`;
    const REFRESH_INTERVAL_MS = 15 * 60 * 1000;
    const SEARCH_STORAGE_KEY = "stock-search-history-v1";
    const AV_KEY_STORAGE = "alphavantage-key-v1";
    const AV_CALL_LOG_KEY = "alphavantage-call-log-v1";
    const MAX_HISTORY_ROWS = 500;

    const AV_BASE = "https://www.alphavantage.co/query";
    const AV_KEY_URL = "https://www.alphavantage.co/support/#api-key";

    // Alpha Vantage rate limits (free tier)
    const AV_MAX_CALLS_PER_MINUTE = 5;
    const AV_INTER_CALL_DELAY_MS = 1200;  // gap between sequential calls

    // ────────────────────────────────────────────────────────────────────────
    const {
      LineChart, Line, XAxis, YAxis, Tooltip, ResponsiveContainer,
      ReferenceLine, Legend,
    } = Recharts;
    const { useState, useEffect, useCallback, useMemo } = React;

    const C = {
      bg: "#0c0c0e", bgCard: "#15161a",
      border: "#25262a", borderStrong: "#33343a",
      text: "#e8e4dc", textMuted: "#7a766f", textFaint: "#4a4742",
      gold: "#d9b072", red: "#c5524a", green: "#6a9d76",
      yellow: "#c5a04a", blue: "#6e8db5",
    };

    // ── Helpers ─────────────────────────────────────────────────────────────
    const fmtDate = (iso) => {
      const d = new Date(iso + "T12:00:00");
      return d.toLocaleDateString("en-US", { month: "short", day: "numeric" });
    };
    const fmtDateLong = (iso) => {
      const d = new Date(iso + "T12:00:00");
      return d.toLocaleDateString("en-US", {
        weekday: "long", year: "numeric", month: "long", day: "numeric",
      });
    };
    const fmtNum = (v, digits = 1) =>
      v == null || isNaN(v) ? "—" : Number(v).toFixed(digits);
    const fmtPrice = (v) =>
      v == null || isNaN(v) ? "—" :
      Number(v).toLocaleString("en-US", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
    const fmtPct = (v) =>
      v == null || isNaN(v) ? "—" : `${(Number(v) * 100).toFixed(1)}%`;
    const fmtMarketCap = (v) => {
      if (v == null || isNaN(v)) return "—";
      const n = Number(v);
      if (n >= 1e12) return `$${(n / 1e12).toFixed(2)}T`;
      if (n >= 1e9) return `$${(n / 1e9).toFixed(2)}B`;
      if (n >= 1e6) return `$${(n / 1e6).toFixed(0)}M`;
      if (n >= 1e3) return `$${(n / 1e3).toFixed(0)}K`;
      return `$${n.toFixed(0)}`;
    };
    const num = (v) => {
      if (v === null || v === undefined || v === "" || v === "None") return null;
      const n = Number(v);
      return isNaN(n) ? null : n;
    };
    const todayISO = () => new Date().toISOString().split("T")[0];
    const sleep = (ms) => new Promise((r) => setTimeout(r, ms));

    const fgStatus = (v) => {
      if (v == null || isNaN(v)) return { label: "—", color: C.textMuted };
      if (v <= 25) return { label: "Extreme Fear", color: C.red };
      if (v <= 45) return { label: "Fear", color: "#d97a4a" };
      if (v <= 55) return { label: "Neutral", color: C.yellow };
      if (v <= 75) return { label: "Greed", color: C.green };
      return { label: "Extreme Greed", color: "#9aa86a" };
    };
    const vixStatus = (v) => {
      if (v == null || isNaN(v)) return { label: "—", color: C.textMuted };
      if (v < 15) return { label: "Calm", color: C.green };
      if (v < 20) return { label: "Normal", color: "#9aa86a" };
      if (v < 30) return { label: "Elevated", color: C.yellow };
      if (v < 40) return { label: "High", color: "#d97a4a" };
      return { label: "Panic", color: C.red };
    };
    const breadthStatus = (v) => {
      if (v == null || isNaN(v)) return { label: "—", color: C.textMuted };
      if (v < 20) return { label: "Oversold", color: C.red };
      if (v < 40) return { label: "Weak", color: "#d97a4a" };
      if (v < 60) return { label: "Mixed", color: C.yellow };
      if (v < 80) return { label: "Healthy", color: C.green };
      return { label: "Overbought", color: "#9aa86a" };
    };

    // ── CSV parsing (dashboard data) ────────────────────────────────────────
    function parseCSV(text) {
      const lines = text.trim().split(/\r?\n/);
      let headerIdx = lines.findIndex((l) =>
        l.trim().toLowerCase().startsWith("date,")
      );
      if (headerIdx < 0) headerIdx = 0;
      if (lines.length - headerIdx < 2) return [];
      const headers = lines[headerIdx].split(",").map((h) => h.trim());
      const rows = [];
      for (let i = headerIdx + 1; i < lines.length; i++) {
        const line = lines[i].trim();
        if (!line) continue;
        const cells = line.split(",");
        if (cells.length < headers.length) continue;
        const r = {};
        for (let j = 0; j < headers.length; j++) {
          r[headers[j]] = (cells[j] ?? "").trim();
        }
        if (r.date && /^\d{4}-\d{2}-\d{2}$/.test(r.date)) {
          rows.push({
            date: r.date,
            sp500: num(r.sp500),
            fearGreed: num(r.fear_greed),
            vix: num(r.vix),
            spxAbove50: num(r.spx_above_50ma),
            spxAbove200: num(r.spx_above_200ma),
          });
        }
      }
      rows.sort((a, b) => a.date.localeCompare(b.date));
      return rows;
    }

    async function fetchDashboardCSV() {
      const url = `${RAW_URL}?_=${Date.now()}`;
      const r = await fetch(url, { cache: "no-store" });
      if (!r.ok) throw new Error(`HTTP ${r.status}`);
      return parseCSV(await r.text());
    }

    // ── Rate limit tracker ──────────────────────────────────────────────────
    function loadCallLog() {
      try {
        const raw = localStorage.getItem(AV_CALL_LOG_KEY);
        if (!raw) return [];
        const arr = JSON.parse(raw);
        return Array.isArray(arr) ? arr : [];
      } catch {
        return [];
      }
    }
    function logApiCall() {
      const now = Date.now();
      const log = loadCallLog().filter((t) => now - t < 60_000);
      log.push(now);
      try {
        localStorage.setItem(AV_CALL_LOG_KEY, JSON.stringify(log));
      } catch {}
    }
    function checkRateLimit(neededCalls) {
      const now = Date.now();
      const log = loadCallLog().filter((t) => now - t < 60_000);
      if (log.length + neededCalls > AV_MAX_CALLS_PER_MINUTE) {
        // How long until enough calls drop off?
        const oldest = log[0];
        const secsLeft = Math.ceil((60_000 - (now - oldest)) / 1000);
        return secsLeft;
      }
      return 0;
    }

    // ── Alpha Vantage stock fetch ───────────────────────────────────────────
    function detectAVError(data, ticker) {
      if (data?.Note) {
        return "Rate limit reached (5/min on free tier). Wait a minute.";
      }
      if (data?.Information) {
        if (data.Information.toLowerCase().includes("api key")) {
          return "Invalid API key. Click 'Change key' to update it.";
        }
        if (data.Information.toLowerCase().includes("daily")) {
          return "Daily rate limit reached (25/day on free tier).";
        }
        return data.Information;
      }
      if (data?.["Error Message"]) {
        return `Unknown ticker "${ticker}"`;
      }
      return null;
    }

    async function fetchAVOverview(ticker, apiKey) {
      const params = new URLSearchParams({
        function: "OVERVIEW", symbol: ticker, apikey: apiKey,
      });
      const url = `${AV_BASE}?${params.toString()}`;
      logApiCall();
      const res = await fetch(url);
      if (!res.ok) throw new Error(`HTTP ${res.status} from Alpha Vantage`);
      let data;
      try {
        data = await res.json();
      } catch {
        throw new Error("Couldn't parse OVERVIEW response");
      }
      const err = detectAVError(data, ticker);
      if (err) throw new Error(err);
      if (!data || Object.keys(data).length === 0 || !data.Symbol) {
        throw new Error(`No data returned for "${ticker}". Check the ticker.`);
      }
      return data;
    }

    async function fetchAVQuote(ticker, apiKey) {
      const params = new URLSearchParams({
        function: "GLOBAL_QUOTE", symbol: ticker, apikey: apiKey,
      });
      const url = `${AV_BASE}?${params.toString()}`;
      logApiCall();
      const res = await fetch(url);
      if (!res.ok) return { price: null, error: `HTTP ${res.status}` };
      let data;
      try {
        data = await res.json();
      } catch {
        return { price: null, error: "invalid JSON" };
      }
      const err = detectAVError(data, ticker);
      if (err) return { price: null, error: err };
      const q = data?.["Global Quote"];
      if (!q || Object.keys(q).length === 0) {
        return { price: null, error: "no quote data" };
      }
      return { price: num(q["05. price"]), error: null };
    }

    function parseAVPercent(s) {
      if (s == null || s === "" || s === "None") return null;
      const stripped = String(s).replace("%", "").trim();
      const n = Number(stripped);
      if (isNaN(n)) return null;
      return n > 1 ? n / 100 : n;
    }

    // ── Search history (browser-local) ──────────────────────────────────────
    function loadSearchHistory() {
      try {
        const raw = localStorage.getItem(SEARCH_STORAGE_KEY);
        if (!raw) return [];
        const arr = JSON.parse(raw);
        return Array.isArray(arr) ? arr : [];
      } catch {
        return [];
      }
    }
    function saveSearchHistory(history) {
      try {
        const trimmed = history.slice(0, MAX_HISTORY_ROWS);
        localStorage.setItem(SEARCH_STORAGE_KEY, JSON.stringify(trimmed));
      } catch (e) {
        console.error("Failed to save search history", e);
      }
    }
    function appendSearch(entry) {
      const history = loadSearchHistory();
      history.unshift(entry);
      saveSearchHistory(history);
      return history;
    }

    function loadApiKey() {
      try {
        return localStorage.getItem(AV_KEY_STORAGE) || "";
      } catch {
        return "";
      }
    }
    function saveApiKey(key) {
      try {
        if (key) localStorage.setItem(AV_KEY_STORAGE, key);
        else localStorage.removeItem(AV_KEY_STORAGE);
      } catch {}
    }

    // ─── Reusable dashboard components (unchanged) ──────────────────────────
    function SP500Banner({ snap, prevSnap }) {
      const v = snap?.sp500;
      const prev = prevSnap?.sp500;
      let change = null, changePct = null, changeColor = C.textMuted;
      if (v != null && prev != null && !isNaN(v) && !isNaN(prev)) {
        change = v - prev;
        changePct = (change / prev) * 100;
        changeColor = change > 0 ? C.green : change < 0 ? C.red : C.textMuted;
      }
      return (
        <div
          className="p-7 rounded-sm flex items-center justify-between flex-wrap gap-6 mb-4"
          style={{
            background: C.bgCard,
            border: `1px solid ${C.border}`,
            borderLeft: `3px solid ${C.gold}`,
          }}
        >
          <div>
            <div style={{
              fontFamily: "'DM Sans', sans-serif", fontSize: "11px",
              fontWeight: 600, letterSpacing: "0.12em", color: C.textMuted,
              textTransform: "uppercase", marginBottom: "8px",
            }}>S&P 500 · ^GSPC</div>
            <div style={{
              fontFamily: "'Fraunces', serif", fontSize: "64px", lineHeight: 1,
              fontWeight: 500, color: C.text, letterSpacing: "-0.02em",
            }}>{fmtPrice(v)}</div>
          </div>
          {change != null && (
            <div className="text-right">
              <div style={{
                fontFamily: "'JetBrains Mono', monospace", fontSize: "20px",
                fontWeight: 500, color: changeColor,
              }}>
                {change >= 0 ? "▲" : "▼"} {fmtPrice(Math.abs(change))}
              </div>
              <div style={{
                fontFamily: "'JetBrains Mono', monospace", fontSize: "14px",
                color: changeColor, marginTop: "4px",
              }}>
                {change >= 0 ? "+" : "−"}{Math.abs(changePct).toFixed(2)}%
              </div>
              <div style={{
                fontFamily: "'DM Sans', sans-serif", fontSize: "11px",
                color: C.textFaint, marginTop: "8px",
                letterSpacing: "0.06em", textTransform: "uppercase",
              }}>vs prior session</div>
            </div>
          )}
        </div>
      );
    }

    function MetricCard({ label, ticker, value, status, description }) {
      return (
        <div
          className="relative p-6 rounded-sm flex flex-col"
          style={{
            background: C.bgCard, border: `1px solid ${C.border}`,
            minHeight: "180px",
          }}
        >
          <div className="flex items-baseline justify-between mb-1">
            <span style={{
              fontFamily: "'DM Sans', sans-serif", fontSize: "11px",
              fontWeight: 600, letterSpacing: "0.12em", color: C.textMuted,
              textTransform: "uppercase",
            }}>{label}</span>
            <span style={{
              fontFamily: "'JetBrains Mono', monospace", fontSize: "10px",
              color: C.textFaint,
            }}>{ticker}</span>
          </div>
          <div style={{
            fontFamily: "'Fraunces', serif", fontSize: "56px", lineHeight: 1,
            fontWeight: 500, color: C.text, letterSpacing: "-0.02em",
            marginTop: "12px",
          }}>{fmtNum(value, 1)}</div>
          <div className="mt-3 flex items-center gap-2">
            <div style={{
              width: "6px", height: "6px",
              background: status.color, borderRadius: "50%",
            }} />
            <span style={{
              fontFamily: "'DM Sans', sans-serif", fontSize: "13px",
              fontWeight: 500, color: status.color, letterSpacing: "0.02em",
            }}>{status.label}</span>
          </div>
          <div style={{
            fontFamily: "'DM Sans', sans-serif", fontSize: "12px",
            color: C.textMuted, marginTop: "10px", lineHeight: 1.5,
          }}>{description}</div>
        </div>
      );
    }

    function MarketBreadthChart({ data }) {
      const last = data[data.length - 1] || {};
      return (
        <div className="p-6 rounded-sm" style={{ background: C.bgCard, border: `1px solid ${C.border}` }}>
          <div className="flex items-baseline justify-between mb-4 flex-wrap gap-2">
            <div>
              <div style={{
                fontFamily: "'DM Sans', sans-serif", fontSize: "11px",
                fontWeight: 600, letterSpacing: "0.12em", color: C.textMuted,
                textTransform: "uppercase",
              }}>Market Breadth</div>
              <div style={{
                fontFamily: "'Fraunces', serif", fontSize: "20px",
                fontWeight: 500, marginTop: "4px", letterSpacing: "-0.01em",
              }}>S&P 500 vs share above moving averages</div>
            </div>
            <div className="flex gap-5 text-right">
              <div>
                <div style={{ fontSize: "10px", color: C.textFaint, letterSpacing: "0.08em", textTransform: "uppercase" }}>SPX</div>
                <div style={{ fontFamily: "'JetBrains Mono', monospace", fontSize: "13px", color: C.gold }}>{fmtPrice(last.sp500)}</div>
              </div>
              <div>
                <div style={{ fontSize: "10px", color: C.textFaint, letterSpacing: "0.08em", textTransform: "uppercase" }}>&gt;50d</div>
                <div style={{ fontFamily: "'JetBrains Mono', monospace", fontSize: "13px", color: C.blue }}>{fmtNum(last.spxAbove50, 1)}%</div>
              </div>
              <div>
                <div style={{ fontSize: "10px", color: C.textFaint, letterSpacing: "0.08em", textTransform: "uppercase" }}>&gt;200d</div>
                <div style={{ fontFamily: "'JetBrains Mono', monospace", fontSize: "13px", color: C.green }}>{fmtNum(last.spxAbove200, 1)}%</div>
              </div>
            </div>
          </div>
          <div style={{ height: "320px" }}>
            <ResponsiveContainer width="100%" height="100%">
              <LineChart data={data} margin={{ top: 10, right: 12, bottom: 5, left: 0 }}>
                <XAxis dataKey="date" tick={{ fontSize: 11, fill: C.textFaint }} tickFormatter={fmtDate} axisLine={{ stroke: C.border }} tickLine={{ stroke: C.border }} interval="preserveStartEnd" minTickGap={40} />
                <YAxis yAxisId="price" orientation="left" domain={["auto", "auto"]} tick={{ fontSize: 11, fill: C.gold }} axisLine={{ stroke: C.border }} tickLine={{ stroke: C.border }} width={56} tickFormatter={(v) => Number(v).toLocaleString("en-US", { maximumFractionDigits: 0 })} />
                <YAxis yAxisId="pct" orientation="right" domain={[0, 100]} tick={{ fontSize: 11, fill: C.textFaint }} axisLine={{ stroke: C.border }} tickLine={{ stroke: C.border }} width={36} tickFormatter={(v) => `${v}`} />
                <ReferenceLine y={50} yAxisId="pct" stroke={C.borderStrong} strokeDasharray="3 4" strokeWidth={1} />
                <Tooltip contentStyle={{ background: C.bg, border: `1px solid ${C.borderStrong}`, borderRadius: "2px", fontFamily: "JetBrains Mono", fontSize: "12px", color: C.text }} labelFormatter={fmtDate} formatter={(v, name) => {
                  if (v == null) return ["—", name];
                  if (name === "S&P 500") return [fmtPrice(v), name];
                  return [`${Number(v).toFixed(1)}%`, name];
                }} />
                <Legend wrapperStyle={{ fontFamily: "'DM Sans', sans-serif", fontSize: "12px", paddingTop: "8px" }} iconType="plainline" />
                <Line yAxisId="price" type="monotone" dataKey="sp500" name="S&P 500" stroke={C.gold} strokeWidth={2} dot={false} activeDot={{ r: 3, fill: C.gold, stroke: C.bg, strokeWidth: 1 }} connectNulls />
                <Line yAxisId="pct" type="monotone" dataKey="spxAbove50" name="% above 50-day" stroke={C.blue} strokeWidth={1.5} dot={false} activeDot={{ r: 3, fill: C.blue, stroke: C.bg, strokeWidth: 1 }} connectNulls />
                <Line yAxisId="pct" type="monotone" dataKey="spxAbove200" name="% above 200-day" stroke={C.green} strokeWidth={1.5} dot={false} activeDot={{ r: 3, fill: C.green, stroke: C.bg, strokeWidth: 1 }} connectNulls />
              </LineChart>
            </ResponsiveContainer>
          </div>
          <div style={{ fontSize: "11px", color: C.textFaint, marginTop: "8px", fontFamily: "'DM Sans', sans-serif", lineHeight: 1.6 }}>
            Watch for divergences: S&P pushing higher while breadth lines fall is a classic warning sign that fewer names are participating in the rally.
          </div>
        </div>
      );
    }

    function MiniChart({ data, dataKey, color, label, domain, refLines = [] }) {
      const last = data[data.length - 1];
      const lastValue = last ? last[dataKey] : null;
      return (
        <div className="p-5 rounded-sm" style={{ background: C.bgCard, border: `1px solid ${C.border}` }}>
          <div className="flex items-baseline justify-between mb-2">
            <span style={{
              fontFamily: "'DM Sans', sans-serif", fontSize: "11px",
              fontWeight: 600, letterSpacing: "0.12em", color: C.textMuted,
              textTransform: "uppercase",
            }}>{label}</span>
            <span style={{
              fontFamily: "'JetBrains Mono', monospace", fontSize: "14px",
              color: C.text, fontWeight: 500,
            }}>{fmtNum(lastValue, 1)}</span>
          </div>
          <div style={{ height: "120px" }}>
            <ResponsiveContainer width="100%" height="100%">
              <LineChart data={data} margin={{ top: 5, right: 5, bottom: 5, left: 0 }}>
                <XAxis dataKey="date" tick={{ fontSize: 10, fill: C.textFaint }} tickFormatter={fmtDate} axisLine={{ stroke: C.border }} tickLine={{ stroke: C.border }} interval="preserveStartEnd" minTickGap={30} />
                <YAxis domain={domain} tick={{ fontSize: 10, fill: C.textFaint }} axisLine={{ stroke: C.border }} tickLine={{ stroke: C.border }} width={32} />
                {refLines.map((rl, i) => (
                  <ReferenceLine key={i} y={rl.y} stroke={C.borderStrong} strokeDasharray="2 3" strokeWidth={1} />
                ))}
                <Tooltip contentStyle={{ background: C.bg, border: `1px solid ${C.borderStrong}`, borderRadius: "2px", fontFamily: "JetBrains Mono", fontSize: "12px", color: C.text }} labelFormatter={fmtDate} formatter={(v) => (v != null ? Number(v).toFixed(2) : "—")} />
                <Line type="monotone" dataKey={dataKey} stroke={color} strokeWidth={1.5} dot={false} activeDot={{ r: 3, fill: color, stroke: C.bg, strokeWidth: 1 }} connectNulls />
              </LineChart>
            </ResponsiveContainer>
          </div>
        </div>
      );
    }

    function HistoryTable({ snapshots }) {
      const recent = [...snapshots].reverse().slice(0, 14);
      if (recent.length === 0) return null;
      const cell = {
        fontFamily: "'JetBrains Mono', monospace", fontSize: "13px",
        color: C.text, padding: "10px 14px",
        borderBottom: `1px solid ${C.border}`,
      };
      const header = {
        fontFamily: "'DM Sans', sans-serif", fontSize: "10px",
        fontWeight: 600, letterSpacing: "0.12em", color: C.textMuted,
        textTransform: "uppercase", padding: "12px 14px",
        borderBottom: `1px solid ${C.borderStrong}`, textAlign: "left",
      };
      return (
        <div className="rounded-sm overflow-x-auto" style={{ background: C.bgCard, border: `1px solid ${C.border}` }}>
          <table className="w-full" style={{ minWidth: "720px" }}>
            <thead>
              <tr>
                <th style={header}>Date</th>
                <th style={{ ...header, textAlign: "right" }}>S&P 500</th>
                <th style={{ ...header, textAlign: "right" }}>F&G</th>
                <th style={{ ...header, textAlign: "right" }}>VIX</th>

    // ─── Stock Lookup section ───────────────────────────────────────────────
    function StockLookup({ history, onSearch, apiKey, onApiKeyChange }) {
      const [ticker, setTicker] = useState("");
      const [running, setRunning] = useState(false);
      const [statusMsg, setStatusMsg] = useState(null);  // "Fetching OVERVIEW…" etc.
      const [result, setResult] = useState(null);
      const [error, setError] = useState(null);

      const cleanedTicker = ticker.trim().toUpperCase();

      const pastForTicker = useMemo(() => {
        if (!cleanedTicker) return [];
        return history.filter((h) => h.ticker === cleanedTicker).slice(0, 5);
      }, [cleanedTicker, history]);

      async function runLookup() {
        if (!cleanedTicker) return;
        if (!apiKey) {
          setError("Please save an Alpha Vantage API key first (top of this section).");
          return;
        }

        // Check rate limit BEFORE making any calls (we'll make 2)
        const waitSec = checkRateLimit(2);
        if (waitSec > 0) {
          setError(`Slow down — Alpha Vantage allows 5 calls/min. Wait ${waitSec}s and try again.`);
          return;
        }

        setRunning(true);
        setError(null);
        setResult(null);

        try {
          // Sequential — fundamentals first, then price.
          setStatusMsg("Fetching fundamentals…");
          const overview = await fetchAVOverview(cleanedTicker, apiKey);

          // Small delay so the 2nd call isn't back-to-back
          await sleep(AV_INTER_CALL_DELAY_MS);

          setStatusMsg("Fetching latest price…");
          const quoteResult = await fetchAVQuote(cleanedTicker, apiKey);

          const entry = {
            timestamp: new Date().toISOString(),
            date: todayISO(),
            ticker: cleanedTicker,
            name: overview.Name || cleanedTicker,
            price: quoteResult.price,
            priceError: quoteResult.error,
            marketCap: num(overview.MarketCapitalization),
            trailingPE: num(overview.PERatio),
            forwardPE: num(overview.ForwardPE),
            forwardPEG: num(overview.PEGRatio),
            instHeldPct: parseAVPercent(overview.PercentInstitutions),
          };
          setResult(entry);
          onSearch(entry);
        } catch (e) {
          setError(e.message);
        } finally {
          setRunning(false);
          setStatusMsg(null);
        }
      }

      function handleKeyDown(e) {
        if (e.key === "Enter") runLookup();
      }

      const btnPrimary = {
        fontFamily: "'DM Sans', sans-serif", fontSize: "13px",
        fontWeight: 500, letterSpacing: "0.04em",
        padding: "10px 24px", background: C.gold, color: C.bg,
        border: "none", borderRadius: "2px", cursor: "pointer",
      };

      const inputStyle = {
        flex: "0 1 240px",
        padding: "10px 14px",
        background: C.bg,
        border: `1px solid ${C.borderStrong}`,
        borderRadius: "2px",
        color: C.text,
        fontFamily: "'JetBrains Mono', monospace",
        fontSize: "14px",
        letterSpacing: "0.05em",
        textTransform: "uppercase",
      };

      return (
        <section
          className="mb-12 p-6 rounded-sm"
          style={{ background: C.bgCard, border: `1px solid ${C.border}` }}
        >
          <div className="mb-1" style={{
            fontFamily: "'DM Sans', sans-serif", fontSize: "11px",
            fontWeight: 600, letterSpacing: "0.12em", color: C.textMuted,
            textTransform: "uppercase",
          }}>Stock Lookup</div>
          <h2 style={{
            fontFamily: "'Fraunces', serif", fontSize: "22px",
            fontWeight: 500, margin: "0 0 16px 0", letterSpacing: "-0.01em",
          }}>Look up a ticker</h2>

          <ApiKeyStrip apiKey={apiKey} onChange={onApiKeyChange} />

          <div className="flex gap-2 flex-wrap items-center">
            <input
              type="text"
              value={ticker}
              onChange={(e) => setTicker(e.target.value)}
              onKeyDown={handleKeyDown}
              placeholder="e.g. AAPL"
              style={inputStyle}
            />
            <button
              onClick={runLookup}
              disabled={running || !cleanedTicker || !apiKey}
              style={{ ...btnPrimary, opacity: running || !cleanedTicker || !apiKey ? 0.5 : 1 }}
            >
              {running ? (statusMsg || "Running…") : "Run"}
            </button>
          </div>

          {error && (
            <div style={{
              marginTop: "16px", padding: "10px 14px",
              background: "rgba(197, 82, 74, 0.1)",
              border: `1px solid ${C.red}`, borderRadius: "2px",
              fontSize: "12px", color: C.red,
              fontFamily: "'JetBrains Mono', monospace",
            }}>{error}</div>
          )}

          {result && (
            <>
              {result.priceError && (
                <div style={{
                  marginTop: "16px", padding: "8px 14px",
                  background: "rgba(197, 160, 74, 0.08)",
                  border: `1px solid ${C.yellow}`, borderRadius: "2px",
                  fontSize: "11px", color: C.yellow,
                  fontFamily: "'JetBrains Mono', monospace",

                <ResultTile label="Inst. held" primary={fmtPct(result.instHeldPct)} />

    function MarketPulseDashboard() {
      const [snapshots, setSnapshots] = useState([]);
      const [loading, setLoading] = useState(true);
      const [refreshing, setRefreshing] = useState(false);
      const [error, setError] = useState(null);
      const [lastRefresh, setLastRefresh] = useState(null);
      const [searchHistory, setSearchHistory] = useState(() => loadSearchHistory());
      const [apiKey, setApiKey] = useState(() => loadApiKey());

      const today = todayISO();
      const latestSnap = snapshots[snapshots.length - 1];
      const prevSnap = snapshots.length >= 2 ? snapshots[snapshots.length - 2] : null;

      const load = useCallback(async (silent = false) => {
        if (!silent) setRefreshing(true);
        setError(null);
        try {
          const data = await fetchDashboardCSV();
          setSnapshots(data);
          setLastRefresh(new Date());
        } catch (e) {
          setError(`Couldn't load data: ${e.message}`);
        } finally {
          setRefreshing(false);
          setLoading(false);
        }
      }, []);

      useEffect(() => {
        load();
        const interval = setInterval(() => load(true), REFRESH_INTERVAL_MS);
        return () => clearInterval(interval);
      }, [load]);

      function handleSearchAppend(entry) {
        const updated = appendSearch(entry);
        setSearchHistory(updated);
      }
      function handleClearHistory() {
        if (!window.confirm("Delete all search history? This can't be undone.")) return;
        localStorage.removeItem(SEARCH_STORAGE_KEY);
        setSearchHistory([]);
      }
      function handleExportHistory() {
        const headers = "timestamp,date,ticker,name,price,market_cap,trailing_pe,forward_pe,peg,inst_held_pct\n";

          const safeName = (r.name || "").replace(/,/g, " ").replace(/"/g, "'");

            r.timestamp, r.date, r.ticker, safeName,
            r.price ?? "",
            r.marketCap ?? "",
            r.trailingPE ?? "",
            r.forwardPE ?? "",
            r.forwardPEG ?? "",
            r.instHeldPct ?? "",
          ].join(",");
        }).join("\n");
        const blob = new Blob([headers + rows], { type: "text/csv" });
        const url = URL.createObjectURL(blob);
        const a = document.createElement("a");
        a.href = url;
        a.download = `stock-searches-${todayISO()}.csv`;
        a.click();
        URL.revokeObjectURL(url);

                  </div>
                </>
              )}
            </section>

            {snapshots.length >= 2 && (
              <section className="mb-12">
                <MarketBreadthChart data={snapshots} />
              </section>
            )}

            {snapshots.length >= 2 && (
              <section className="mb-12">
                <h2 style={{
                  fontFamily: "'Fraunces', serif", fontSize: "22px",
                  fontWeight: 500, margin: "0 0 20px 0", letterSpacing: "-0.01em",
                }}>
                  Sentiment & volatility ·{" "}
                  <span style={{ color: C.textMuted, fontSize: "16px" }}>
                    {snapshots.length} days
                  </span>
                </h2>
                <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                  <MiniChart data={snapshots} dataKey="fearGreed" color={C.gold} label="Fear & Greed" domain={[0, 100]} refLines={[{ y: 25 }, { y: 50 }, { y: 75 }]} />
                  <MiniChart data={snapshots} dataKey="vix" color={C.red} label="VIX" domain={["auto", "auto"]} refLines={[{ y: 20 }, { y: 30 }]} />
                </div>
              </section>
            )}

            {snapshots.length > 0 && (
              <section className="mb-12">
                <h2 style={{
                  fontFamily: "'Fraunces', serif", fontSize: "22px",
                  fontWeight: 500, margin: "0 0 20px 0", letterSpacing: "-0.01em",
                }}>
                  History ·{" "}
                  <span style={{ color: C.textMuted, fontSize: "16px" }}>
                    {snapshots.length} {snapshots.length === 1 ? "snapshot" : "snapshots"} total
                  </span>
                </h2>
                <HistoryTable snapshots={snapshots} />
                {snapshots.length > 14 && (
                  <div style={{
                    fontSize: "12px", color: C.textMuted, marginTop: "12px",
                    textAlign: "right",
                  }}>
                    Showing 14 most recent ·{" "}
                    <a href={RAW_URL} target="_blank" rel="noreferrer" style={{ color: C.gold }}>
                      view full CSV
                    </a>
                  </div>
                )}
              </section>
            )}

            <StockLookup
              history={searchHistory}
              onSearch={handleSearchAppend}
              apiKey={apiKey}
              onApiKeyChange={handleApiKeyChange}
            />

            <SearchHistorySection
              history={searchHistory}
              onClear={handleClearHistory}
              onExport={handleExportHistory}
            />

            <footer style={{
              marginTop: "64px", paddingTop: "24px",
              borderTop: `1px solid ${C.border}`, fontSize: "12px",
              color: C.textFaint, lineHeight: 1.7,
            }}>
              <div style={{ marginBottom: "8px" }}>
                Auto-refreshes every 15 minutes. Data collected daily by GitHub Actions
                (weekdays at 6pm ET) from{" "}
                <a href={`https://github.com/${GH_USER}/${GH_REPO}`} target="_blank" rel="noreferrer" style={{ color: C.textMuted }}>
                  {GH_USER}/{GH_REPO}
                </a>.
              </div>
              <div>
                Dashboard sources: Yahoo Finance (^GSPC, ^VIX) · CNN Business · Barchart ($S5FI, $S5TH).
                Stock lookup powered by Alpha Vantage (free tier: 25 requests/day, 5/min).
              </div>
            </footer>
          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById("root"));
    root.render(<MarketPulseDashboard />);
  </script>
</body>
</html>
